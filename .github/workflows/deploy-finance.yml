name: Deploy finance portal
on:
  push:
    branches: [main]
    paths:
      - 'System-3.0/**'
      - '.github/workflows/deploy-finance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: System-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'System-3.0/package-lock.json'
      - run: npm ci
      - run: npm run audit:deps
      - run: npm test
      - run: npm run build && node scripts/verify-build-assets.mjs
      - name: Deploy Worker and static assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
