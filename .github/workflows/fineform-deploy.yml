name: Fine Form 3.0 — validar e publicar
on:
  push:
    branches: [main]
    paths:
      - 'System-3.0/**'
      - '.github/workflows/fineform-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fineform-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System-3.0
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: System-3.0/package-lock.json
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Executar testes
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Publicar no Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Avisar quando não houver token configurado
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Configure o secret CLOUDFLARE_API_TOKEN no GitHub para habilitar a publicação automática. O código já está versionado e validado."
