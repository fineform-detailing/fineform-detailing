name: Fine Form — verificação do redesign
on:
  push:
    branches: [feat/fine-care-static-cards-20261030]
  pull_request:
    branches: [main]
    paths:
      - 'System-3.0/**'
      - '.github/workflows/fineform-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Testes e compilação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: System-3.0/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .test-build
