<div class="ff-intro" id="ff-intro" role="status" aria-label="Carregando Fine Form" aria-live="off" hidden>
  <div class="intro-sheet">
    <img class="intro-logo" src="/assets/logo-original.png" width="48" height="48" alt="">
    <div class="intro-wordmark">FINE FORM</div>
    <p class="intro-subtitle">ESTÉTICA AUTOMOTIVA</p>
    <div class="comet-dial" aria-label="Progresso do carregamento">
      <svg class="comet-dial__ring" viewBox="0 0 200 200" data-comet-dial role="progressbar" aria-label="Carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <g class="comet-dial__ticks" data-comet-ticks aria-hidden="true"></g>
        <path class="comet-dial__track" data-comet-track></path>
        <path class="comet-dial__lit" data-comet-lit></path>
        <g class="comet-dial__comet" aria-hidden="true">
          <path data-comet-trail="0" opacity="0"></path>
          <path data-comet-trail="1" opacity="0"></path>
          <path data-comet-trail="2" opacity="0"></path>
          <path data-comet-trail="3" opacity="0"></path>
          <path data-comet-trail="4" opacity="0"></path>
          <path data-comet-trail="5" opacity="0"></path>
          <path data-comet-trail="6" opacity="0"></path>
          <path data-comet-trail="7" opacity="0"></path>
          <path data-comet-trail="8" opacity="0"></path>
          <path data-comet-trail="9" opacity="0"></path>
          <path data-comet-trail="10" opacity="0"></path>
          <path data-comet-trail="11" opacity="0"></path>
        </g>
        <circle class="comet-dial__head" data-comet-head r="7"></circle>
      </svg>
      <div class="comet-dial__readout" aria-hidden="true">
        <span class="comet-dial__value"><span data-comet-value>0</span><small>%</small></span>
        <span class="comet-dial__center-label">FINE FORM</span>
      </div>
    </div>
    <p class="intro-status" data-intro-status>Preparando a sua experiência</p>
    <button class="intro-skip" type="button" data-intro-skip>Entrar direto ↗</button>
  </div>
</div>
